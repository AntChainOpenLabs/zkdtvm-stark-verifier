[package]
name = "dt-recursion"
description = "Recursion AIR chips for zkdtvm-stark-verifier."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dt-derive = { workspace = true }
dt-primitives = { workspace = true }
dt-stark = { workspace = true }
