[workspace.package]
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AntChainOpenLabs/zkdtvm-stark-verifier"
keywords = ["zkvm", "verifier", "zero-knowledge"]
categories = ["cryptography"]

[workspace]
members = [
    "crates/verify",
    "cli",
]
exclude = ["vendor/zkdtvm-suite"]
resolver = "2"

[profile.release]
opt-level = 3

[profile.bench]
opt-level = 3

[profile.fast]
inherits = "release"
debug = true
debug-assertions = true

[workspace.dependencies]
# --- zkdtvm-stark-verifier local crates ---
zkdtvm-stark-verifier = { path = "crates/verify" }

# --- vendored zkdtvm-suite v0.8.0 verifier stack ---
dt-core-executor = { path = "vendor/zkdtvm-suite/sp1/crates/core/executor", default-features = false, features = ["koalabear"] }
dt-core-machine = { path = "vendor/zkdtvm-suite/sp1/crates/core/machine", default-features = false, features = ["koalabear", "ext5"] }
dt-primitives = { path = "vendor/zkdtvm-suite/sp1/crates/primitives", default-features = false, features = ["koalabear", "ext5"] }
dt-prover = { path = "vendor/zkdtvm-suite/sp1/crates/sc_prover", default-features = false, features = ["koalabear", "ext5", "native-recursion"] }
dt-recursion-core = { path = "vendor/zkdtvm-suite/sp1/crates/recursion/core", default-features = false, features = ["koalabear", "ext5"] }
dt-stark = { path = "vendor/zkdtvm-suite/sp1/crates/stark", default-features = false, features = ["koalabear", "ext5"] }
p3-field = { package = "dt-p3-field", version = "=0.8.0" }

# --- third-party ---
bincode = "1.3.3"
clap = { version = "4.5", features = ["derive", "env"] }
itertools = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "env-filter"] }
anyhow = "1.0"
blake3 = { version = "1.6.1", default-features = false }
sha2 = "0.10"
hashbrown = { version = "0.14.5", features = ["serde"] }
log = "0.4"
rand = "0.8.5"
num-bigint = { version = "0.4.3", default-features = false }
num-traits = "0.2.19"
arrayref = "0.3.8"
strum = "0.26.3"
strum_macros = "0.26.4"
rayon = "1.7"
enum-map = { version = "2.7", features = ["serde"] }
lazy_static = "1.5.0"

[workspace.lints.clippy]
missing_docs = "warn"
