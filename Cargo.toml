[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AntChainOpenLabs/zkdtvm-stark-verifier"
keywords = ["zkvm", "verifier", "zero-knowledge"]
categories = ["cryptography"]

[workspace]
members = [
    "crates/basefold",
    "crates/derive",
    "crates/primitives",
    "crates/stark",
    "crates/recursion",
    "crates/verify",
    "cli",
]
resolver = "2"

[profile.release]
opt-level = 3

[profile.bench]
opt-level = 3

[profile.fast]
inherits = "release"
debug = true
debug-assertions = true

[workspace.dependencies]
# --- zkdtvm-stark-verifier local crates ---
zkdtvm-stark-verifier = { path = "crates/verify" }
dt-derive = { path = "crates/derive" }
dt-primitives = { path = "crates/primitives" }
dt-stark = { path = "crates/stark" }
dt-basefold = { path = "crates/basefold", features = ["basefold"] }
dt-recursion = { path = "crates/recursion" }

# --- Plonky3 (dt-compatible fork, published on crates.io) ---
p3-field = { package = "dt-p3-field", version = "=0.6.2-fix.1" }
p3-air = { package = "dt-p3-air", version = "=0.6.2-fix.1" }
p3-baby-bear = { package = "dt-p3-baby-bear", version = "=0.6.2-fix.1", features = ["nightly-features"] }
p3-koala-bear = { package = "dt-p3-koala-bear", version = "=0.6.2-fix.1" }
p3-poseidon2 = { package = "dt-p3-poseidon2", version = "=0.6.2-fix.1" }
p3-symmetric = { package = "dt-p3-symmetric", version = "=0.6.2-fix.1" }
p3-matrix = { package = "dt-p3-matrix", version = "=0.6.2-fix.1" }
p3-merkle-tree = { package = "dt-p3-merkle-tree", version = "=0.6.2-fix.1" }
p3-commit = { package = "dt-p3-commit", version = "=0.6.2-fix.1" }
p3-fri = { package = "dt-p3-fri", version = "=0.6.2-fix.1" }
p3-challenger = { package = "dt-p3-challenger", version = "=0.6.2-fix.1" }
p3-util = { package = "dt-p3-util", version = "=0.6.2-fix.1" }
p3-dft = { package = "dt-p3-dft", version = "=0.6.2-fix.1" }
p3-uni-stark = { package = "dt-p3-uni-stark", version = "=0.6.2-fix.1" }
p3-maybe-rayon = { package = "dt-p3-maybe-rayon", version = "=0.6.2-fix.1", features = ["parallel"] }

# --- third-party ---
bincode = "1.3.3"
clap = { version = "4.5", features = ["derive", "env"] }
itertools = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "env-filter"] }
anyhow = "1.0"
blake3 = { version = "1.6.1", default-features = false }
sha2 = "0.10"
hashbrown = { version = "0.14.5", features = ["serde"] }
log = "0.4"
rand = "0.8.5"
num-bigint = { version = "0.4.3", default-features = false }
num-traits = "0.2.19"
arrayref = "0.3.8"
strum = "0.26.3"
strum_macros = "0.26.4"
rayon = "1.7"
enum-map = { version = "2.7", features = ["serde"] }
lazy_static = "1.5.0"

[workspace.lints.clippy]
missing_docs = "warn"
