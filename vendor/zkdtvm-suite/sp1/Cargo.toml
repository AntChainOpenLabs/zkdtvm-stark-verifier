[workspace.package]
version = "5.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/succinctlabs/sp1"
keywords = ["sp1", "succinct", "zero-knowledge", "zkvm"]
categories = ["cryptography"]

include = ["DT_VERSION"]

[workspace]
members = [
  "crates/build",
  "crates/core/executor",
  "crates/core/machine",
  "crates/polyair",
  "crates/core/test-elf",
  "crates/curves",
  "crates/derive",
  "crates/sc_prover",
  "crates/recursion/circuit",
  "crates/recursion/compiler",
  "crates/recursion/core",
  "crates/recursion/derive",
  "crates/native-recursion",
  "crates/native-recursion/derive",
  "crates/recursion/gnark-ffi",
  "crates/sdk_sc",
  "crates/stark",
  "crates/zkvm/*",
  "examples/fibonacci/script",

  # "crates/executor",  # deleted locally
  # "crates/gpu/machine",  # deleted locally
  # "crates/gpu/native-recursion",  # deleted locally
  # "crates/gpu/prover",  # deleted locally
  # "crates/gpu/stark",  # deleted locally
]
exclude = ["examples/target", "crates/core/test-elf/program"]
resolver = "2"

[profile.release]
opt-level = 3

[profile.bench]
opt-level = 3

[profile.fast]
inherits = "release"
debug = true
debug-assertions = true

[workspace.dependencies]
pcs = { path = "../WHIR-pcs/pcs", package = "whir-pcs" }
# sp1
dt-build = { path = "crates/build", version = "5.0.0", default-features = false }
dt-core-machine = { path = "crates/core/machine", version = "5.0.0", default-features = false }
dt-core-executor = { path = "crates/core/executor", version = "5.0.0", default-features = false }
dt-curves = { path = "crates/curves", version = "5.0.0" }
dt-derive = { path = "crates/derive", version = "5.0.0" }
dt-primitives = { path = "crates/primitives", version = "5.0.0", default-features = false }
dt-prover = { path = "crates/sc_prover", default-features = false }
dt-recursion-compiler = { path = "crates/recursion/compiler", version = "5.0.0", default-features = false, features = ["debug"] }
dt-recursion-core = { path = "crates/recursion/core", version = "5.0.0", default-features = false }
dt-recursion-derive = { path = "crates/recursion/derive", version = "5.0.0", default-features = false }
dt-recursion-gnark-ffi = { path = "crates/recursion/gnark-ffi", version = "5.0.0", default-features = false }
dt-recursion-circuit = { path = "crates/recursion/circuit", version = "5.0.0", default-features = false, features = ["verify"] }
dt-sdk = { path = "crates/sdk_sc", default-features = false }
dt-stark = { path = "crates/stark", version = "5.0.0", default-features = false }
native-recursion = { path = "crates/native-recursion", default-features = false }
polyair = { path = "crates/polyair", default-features = false }
dt-lib = { path = "crates/zkvm/lib", version = "5.0.0", default-features = false }
dt-zkvm = { path = "crates/zkvm/entrypoint", version = "5.0.0", default-features = false }

# Required by the verifier dependency graph.
dt-core-test-elf = { path = "crates/core/test-elf" }

# dt-executor = { path = "crates/executor", default-features = false }  # deleted locally
# dt-gpu-machine = { path = "crates/gpu/machine", default-features = false }  # deleted locally
# gpu-native-recursion = { path = "crates/gpu/native-recursion" }  # deleted locally
# dt-gpu-prover = { path = "crates/gpu/prover", default-features = false }  # deleted locally
# dt-gpu-stark = { path = "crates/gpu/stark", default-features = false }  # deleted locally

# cuda
cudart = { git = "https://github.com/matter-labs/era-cuda.git", rev = "0ac0eeb7fdef62e3ef05c97de0c8accbc963f3bc" }
cudart-sys = { git = "https://github.com/matter-labs/era-cuda.git", rev = "0ac0eeb7fdef62e3ef05c97de0c8accbc963f3bc" }

# Published dt-compatible Plonky3 crates used by the verifier snapshot.
p3-field = { package = "dt-p3-field", version = "=0.8.0" }
p3-air = { package = "dt-p3-air", version = "=0.8.0" }
p3-baby-bear = { package = "dt-p3-baby-bear", version = "=0.8.0", features = ["nightly-features"] }
p3-bn254-fr = { package = "dt-p3-bn254-fr", version = "=0.8.0" }
p3-koala-bear = { package = "dt-p3-koala-bear", version = "=0.8.0" }
p3-poseidon2 = { package = "dt-p3-poseidon2", version = "=0.8.0" }
p3-symmetric = { package = "dt-p3-symmetric", version = "=0.8.0" }
p3-dft = { package = "dt-p3-dft", version = "=0.8.0" }
p3-matrix = { package = "dt-p3-matrix", version = "=0.8.0" }
p3-merkle-tree = { package = "dt-p3-merkle-tree", version = "=0.8.0" }
p3-commit = { package = "dt-p3-commit", version = "=0.8.0" }
p3-fri = { package = "dt-p3-fri", version = "=0.8.0" }
p3-challenger = { package = "dt-p3-challenger", version = "=0.8.0" }
p3-util = { package = "dt-p3-util", version = "=0.8.0" }
p3-interpolation = { package = "dt-p3-interpolation", version = "=0.8.0" }
p3-uni-stark = { package = "dt-p3-uni-stark", version = "=0.8.0" }
p3-keccak-air = { package = "dt-p3-keccak-air", version = "=0.8.0" }
p3-sha256 = { package = "dt-p3-sha256", version = "=0.8.0" }
p3-mds = { package = "dt-p3-mds", version = "=0.8.0" }
p3-maybe-rayon = { package = "dt-p3-maybe-rayon", version = "=0.8.0", features = ["parallel"] }

# misc
hashbrown = "0.14.5"
itertools = "0.13.0"
serde = "1.0.204"
serde_json = "1.0.132"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
time = ">=0.3.0, <0.3.37"
blake3 = { version = "1.6.1", default-features = false }
sha2 = { version = "0.10.8", default-features = false }


log = "0.4.21"
enum-map = { version = "2.7.3", features = ["serde"] }
[workspace.metadata.typos]
default.extend-ignore-re = [
  "Jo-Philipp Wich",
  "SubEIN",
  "DivEIN",
  "CommitCommitedValuesDigest",
]
default.extend-ignore-words-re = ["(?i)groth", "TRE"]

 [workspace.lints.clippy]
 # Use "warn" instead of "deny" to allow println in tests/debug code
 # Use "deny" only for production code that should use tracing instead
 print_stdout = "warn"
 print_stderr = "warn"
