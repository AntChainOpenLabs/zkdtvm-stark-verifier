[package]
name = "dt-sdk"
description = "SP1 is a performant, 100% open-source, contributor-friendly zkVM."
readme = "../../README.md"
# todo!(n): use workspace version on next release
version = "5.0.2"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
prost = { version = "0.13", optional = true }
serde = { workspace = true, features = ["derive"] }
twirp = { package = "twirp-rs", version = "0.13.0-succinct", optional = true }
async-trait = "0.1.81"
reqwest-middleware = { version = "0.3.2", optional = true }
reqwest = { version = "0.12.12", default-features = false, features = [
  "rustls-tls",
  "trust-dns",
  "stream",
  "json",
], optional = true }
anyhow = "1.0.83"
dt-prover = { workspace = true, default-features = false }
dt-core-machine = { workspace = true }
dt-build = { workspace = true, default-features = false }
futures = "0.3.30"
bincode = "1.3.3"
tokio = { version = "1.44.2", features = ["full"], optional = true }
p3-field = { workspace = true }
p3-baby-bear = { workspace = true }
p3-fri = { workspace = true }
indicatif = "0.17.8"
tracing = { workspace = true }
hex = "0.4.3"
dirs = "5.0.1"
tempfile = "3.10.1"
cfg-if = "1.0"
strum = "0.26.3"
strum_macros = "0.26.4"
thiserror = "1.0.63"
hashbrown = { workspace = true }
dt-core-executor = { workspace = true }
# Must disable stark defaults: `dt-stark` default enables `koalabear`, which would merge with
# `dt-sdk/babybear` and activate both `koalabear` + `babybear` on `dt-primitives` (mutually exclusive).
dt-stark = { workspace = true, default-features = false }
dt-primitives = { workspace = true }
itertools = { workspace = true }
tonic = { version = "0.12", features = ["tls", "tls-roots"], optional = true }
alloy-primitives = { version = "1.0", default-features = false, optional = true, features = ["k256", "serde"] }
backoff = { version = "0.4", features = ["tokio"], optional = true }

# TEE Dependencies
k256 = { version = "0.13.3", features = ["serde"] } # Signing
eventsource-stream = { version = "0.2.0" } # SSE Extenstion for reqwest
pcs = {workspace = true}
[dev-dependencies]
# The field features are hardcoded on this DEV edge only: test-artifacts' build script
# pulls dt-build → dt-prover in the resolver-v2 BUILD-DEP universe, which does not
# inherit the field selection from the normal-dep graph — without a field the build
# universe cannot compile at all (pre-existing; surfaced by the M3 gate-(b) test combo).
# Consequence: `cargo test -p dt-sdk` supports koalabear only (babybear `cargo check`
# stays green — dev-deps are not in the check graph).
test-artifacts = { path = "../test-artifacts", features = ["koalabear", "ext5"] }
tokio-test = { version = "0.4" }

[features]
default = ["network", "koalabear", "ext5", "native-recursion"]
# The native recursion ladder as the `.compressed()` backend (koalabear + ext5 only).
native-recursion = ["dt-prover/native-recursion"]
native-gnark = ["dt-prover/native-gnark"]
# TODO: Once alloy has a 1.* release, we can likely remove this feature flag, as there will be less 
# dependency resolution issues.
network = [
  "dep:prost",
  "dep:alloy-primitives",
  "dep:tokio",
  "dep:reqwest",
  "dep:twirp",
  "dep:reqwest-middleware",
  "dep:tonic",
  "dep:backoff",
]
cuda = []
koalabear = [
  "dt-prover/koalabear",
  "dt-stark/koalabear",
  "dt-primitives/koalabear",
  "dt-core-machine/koalabear",
  "dt-core-executor/koalabear",
  "dt-build/koalabear",
]
babybear = [
  "dt-prover/babybear",
  "dt-stark/babybear",
  "dt-primitives/babybear",
  "dt-core-machine/babybear",
  "dt-core-executor/babybear",
  "dt-build/babybear",
]
ext5 = [
  "dt-prover/ext5",
  "dt-stark/ext5",
  "dt-primitives/ext5",
  "dt-build/ext5",
]
bigint-rug = ["dt-core-machine/bigint-rug"]

profiling = ["dt-core-executor/profiling"]

[lints]
workspace = true
