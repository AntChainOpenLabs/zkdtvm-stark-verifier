[package]
name = "dt-stark"
description = "SP1 is a performant, 100% open-source, contributor-friendly zkVM."
readme = "../../README.md"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
# sp1
dt-derive = { workspace = true }
dt-primitives = { workspace = true }

# p3
p3-air = { workspace = true }
p3-field = { workspace = true }
p3-matrix = { workspace = true }
p3-uni-stark = { workspace = true }
p3-util = { workspace = true }
p3-challenger = { workspace = true }
p3-commit = { workspace = true }
p3-maybe-rayon = { workspace = true, features = ["parallel"] }
p3-baby-bear = { workspace = true }
p3-koala-bear = { workspace = true }
p3-dft = { workspace = true }
p3-fri = { workspace = true }
p3-merkle-tree = { workspace = true }
p3-symmetric = { workspace = true }
p3-poseidon2 = { workspace = true }
p3-sha256 = { workspace = true }
log = { workspace = true }
pcs = { workspace = true }
# misc
rand = "0.8.5"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hashbrown = { version = "0.14.5", features = ["serde", "inline-more"] }
itertools = { workspace = true }
tracing = { workspace = true }
rayon-scan = "0.1.1"
arrayref = "0.3.8"
num-bigint = { version = "0.4.3", default-features = false }

strum = "0.26.3"
strum_macros = "0.26.4"
sysinfo = "0.30.13"
num-traits = "0.2.19"
enum-map = { workspace = true, features = ["serde"] }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[features]
# This workspace target is KoalaBear/ext5.
default = ["koalabear", "ext5"]
koalabear = ["dt-primitives/koalabear"]
babybear = ["dt-primitives/babybear"]
ext5 = ["dt-primitives/ext5"]

[dev-dependencies]
dt-zkvm = { path = "../zkvm/entrypoint", default-features = false }

[lints]
workspace = true
