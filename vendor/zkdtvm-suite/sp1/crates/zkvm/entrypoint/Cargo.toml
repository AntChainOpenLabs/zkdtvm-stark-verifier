[package]
name = "dt-zkvm"
description = "SP1 is a performant, 100% open-source, contributor-friendly zkVM."
readme = "../../../README.md"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
cfg-if = "1.0.0"
getrandom = { version = "0.2.15", features = ["custom"] }
rand = "0.8.5"
libm = { version = "0.2.8", optional = true }
sha2 = { version = "0.10.8" }
lazy_static = "1.5.0"

# optional
dt-lib = { workspace = true, optional = true }
dt-primitives = { workspace = true }
p3-baby-bear = { workspace = true, optional = true }
p3-koala-bear = { workspace = true, optional = true }
p3-field = { workspace = true, optional = true }
embedded-alloc = { version = "0.6.0", optional = true }
critical-section = { version = "1.2.0", optional = true }
blake3 = { workspace = true, optional = true }

[features]
default = ["libm", "lib", "koalabear"]
embedded = ["dep:embedded-alloc", "dep:critical-section"]
libm = ["dep:libm"]
lib = ["dep:dt-lib"]
verify = ["dep:p3-field", "dt-lib/verify"]
koalabear = ["dep:p3-koala-bear", "dep:p3-field", "dt-primitives/koalabear"]
babybear = ["dep:p3-baby-bear", "dep:p3-field", "dt-primitives/babybear"]
blake3 = ["dep:blake3"]

[lints]
workspace = true
