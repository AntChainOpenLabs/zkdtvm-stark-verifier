[package]
name = "dt-core-machine"
description = "SP1 is a performant, 100% open-source, contributor-friendly zkVM."
readme = "../../../README.md"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
links = "dt-core-machine-sys"

[dependencies]
bincode = "1.3.3"
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
itertools = { workspace = true }
num = { version = "0.4.3" }
p3-air = { workspace = true }
p3-baby-bear = { workspace = true }
p3-koala-bear = { workspace = true }
p3-challenger = { workspace = true }
p3-field = { workspace = true }
p3-keccak-air = { workspace = true }
p3-matrix = { workspace = true }
p3-maybe-rayon = { workspace = true, features = ["parallel"] }
p3-uni-stark = { workspace = true }
p3-util = { workspace = true }
p3-symmetric = { workspace = true }
p3-mds = {workspace = true}
dt-derive = { workspace = true }
dt-primitives = { workspace = true }

rayon = "1.10.0"
rayon-scan = "0.1.1"

amcl = { package = "snowbridge-amcl", version = "1.0.2", default-features = false, features = [
  "bls381",
] }
cfg-if = "1.0.0"
generic-array = { version = "=1.1.0", features = ["alloc", "serde"] }
typenum = "1.17.0"
elliptic-curve = "0.13.8"
hex = "0.4.3"
k256 = { version = "0.13.3", features = ["expose-field"] }
p256 = { version = "0.13.2", features = ["expose-field"] }

num_cpus = "1.16.0"
size = "0.4.1"
tempfile = "3.10.1"
tracing = { workspace = true }
tracing-forest = { version = "0.1.6", features = ["ansi", "smallvec"] }
tracing-subscriber = { workspace = true, features = ["std", "env-filter"] }
strum_macros = "0.26"
strum = "0.26"
web-time = "1.1.0"
thiserror = "1.0.63"
rand = "0.8.5"
hashbrown = { workspace = true, features = ["serde", "inline-more"] }
static_assertions = "1.1.0"

dt-stark = { workspace = true, default-features = false }
polyair = { workspace = true, default-features = false }
dt-core-executor = { workspace = true }
dt-curves = { workspace = true }
dt-core-test-elf = { workspace = true }
p3-poseidon2 = { workspace = true }

[dev-dependencies]
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
criterion = "0.5.1"
num = { version = "0.4.3", features = ["rand"] }
rand = "0.8.5"
dt-zkvm = { path = "../../zkvm/entrypoint" }
dt-core-executor = { path = "../executor" }
test-artifacts = { path = "../../test-artifacts" }
dt-core-test-elf = { workspace = true }
p3-commit = { workspace = true }
p3-dft = { workspace = true }
p3-fri = { workspace = true }
p3-merkle-tree = { workspace = true }

[build-dependencies]
dt-stark = { workspace = true, default-features = false }
dt-primitives = { workspace = true }
p3-baby-bear = { workspace = true }
cbindgen = "0.27.0"
cc = "1.1"
pathdiff = "0.2.1"
glob = "0.3.1"

[features]
default = ["sys"]
sumcheck = []
koalabear = ["dt-primitives/koalabear", "dt-stark/koalabear", "dt-core-executor/koalabear", "test-artifacts/koalabear", "polyair/koalabear"]
babybear = ["dt-primitives/babybear", "dt-stark/babybear", "dt-core-executor/babybear", "test-artifacts/babybear", "polyair/babybear"]
ext5 = [
  "dt-primitives/ext5",
  "dt-stark/ext5",
  "dt-core-executor/ext5",
  "test-artifacts/ext5",
  "polyair/ext5",
]
debug = []
test-utils = []
bigint-rug = ["dt-curves/bigint-rug"]
sys = []

[lib]
path = "src/lib.rs"
bench = false

[[test]]
name = "global_sources_c0"
path = "tests/global_sources_c0.rs"
required-features = ["sys", "koalabear", "ext5", "test-utils"]

[lints]
workspace = true
